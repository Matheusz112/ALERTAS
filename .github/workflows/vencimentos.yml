name: Verificar Vencimentos

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Mostrar arquivos
        run: ls

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Executar sistema
        run: node index.js
